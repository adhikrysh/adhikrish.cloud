server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    error_page 404 /404.html;

    location = /etc { return 301 /essays$is_args$args; }
    location = /etc/ { return 301 /essays$is_args$args; }
    location = /etc.html { return 301 /essays$is_args$args; }
    location ~ ^/etc/(.+)\.html$ { return 301 /essays/$1$is_args$args; }
    location ~ ^/etc/([^/]+)/$ { return 301 /essays/$1$is_args$args; }
    location ~ ^/etc/(.+)$ { return 301 /essays/$1$is_args$args; }

    location = /src { return 301 /projects$is_args$args; }
    location = /src/ { return 301 /projects$is_args$args; }
    location = /src.html { return 301 /projects$is_args$args; }
    location ~ ^/src/(.+)\.html$ { return 301 /projects/$1$is_args$args; }
    location ~ ^/src/([^/]+)/$ { return 301 /projects/$1$is_args$args; }
    location ~ ^/src/(.+)$ { return 301 /projects/$1$is_args$args; }

    location ~ ^/(essays|projects)/([^/]+)/$ { return 301 /$1/$2$is_args$args; }

    location = /essays/ { return 301 /essays$is_args$args; }
    location = /projects/ { return 301 /projects$is_args$args; }

    location = /essays {
        try_files /essays.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /projects {
        try_files /projects.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location / {
        try_files $uri.html $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /assets/favicon-3429acb34b1b.png {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /assets/favicon-7330e902055f.png {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /assets/inter-latin-c940764593d0.woff2 {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /assets/projects/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.png$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }
}
