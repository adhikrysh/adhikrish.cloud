server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    error_page 404 /404.html;

    location ~ ^/(etc|essays)(/|\.html)?$ { return 301 /txt$is_args$args; }
    location ~ ^/(etc|essays)/(.+?)(\.html|/)?$ { return 301 /txt/$2$is_args$args; }

    location = /projects { return 301 /src$is_args$args; }
    location = /projects/ { return 301 /src$is_args$args; }
    location = /projects.html { return 301 /src$is_args$args; }
    location ~ ^/projects/(.+)\.html$ { return 301 /src/$1$is_args$args; }
    location ~ ^/projects/([^/]+)/$ { return 301 /src/$1$is_args$args; }
    location ~ ^/projects/(.+)$ { return 301 /src/$1$is_args$args; }

    location = /src/ { return 301 /src$is_args$args; }
    location = /src.html { return 301 /src$is_args$args; }
    location ~ ^/src/([^/]+)\.html$ { return 301 /src/$1$is_args$args; }
    location ~ ^/(txt|src)/([^/]+)/$ { return 301 /$1/$2$is_args$args; }

    location = /txt/ { return 301 /txt$is_args$args; }
    location = /txt.html { return 301 /txt$is_args$args; }
    location ~ ^/txt/([^/]+)\.html$ { return 301 /txt/$1$is_args$args; }

    location = /txt {
        try_files /txt.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /src {
        try_files /src.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location / {
        try_files $uri.html $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /assets/favicon-3429acb34b1b.png {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /assets/favicon-7330e902055f.png {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /assets/inter-latin-c940764593d0.woff2 {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /assets/projects/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ \.png$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }
}
